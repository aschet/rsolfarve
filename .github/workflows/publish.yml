name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/olfarve
    permissions:
      # Required for crates.io trusted publishing; no API token needs to be
      # stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # No Swatinem/rust-cache here: cargo package's verification build
      # creates and removes a symlinked target dir that has raced with the
      # cache action's post-job scan.
      - name: Package
        run: cargo package --locked
      - uses: actions/upload-artifact@v7
        with:
          name: crate
          path: target/package/*.crate
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
